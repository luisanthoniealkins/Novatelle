<script>
'use strict';
const LESSON=JSON.parse(document.getElementById('lesson-data').textContent);
const UI={en:{circle:'Circle: toggle color',rectangle:'Rectangle: toggle color',shapeHint:'Hover to highlight. Click or tap to change color.',shapeGroup:'Interactive shapes',settings:'Playback settings',captions:'Subtitles',chapter:'Chapter',chapters:'Chapters',play:'▶ Play',pause:'Ⅱ Pause',resume:'▶ Resume',replay:'↻ Replay',prev:'Previous chapter',next:'Next chapter',voice:'Voice',speed:'Speed',start:'▶ Let it speak',welcome:'Press Play for browser narration. Captions work without a voice.',ready:'Ready when you are.',playing:'Playing',paused:'Paused',ended:'Your turn. Make something worth explaining.',text:'Text mode · no matching voice available.',error:'Text mode · speech unavailable or interrupted.',voiceReady:'Browser voice · availability and offline support vary.',change:'Voice / speed changes restart this segment.',language:'Switch to Indonesian',source:'Source & downloads',sourceInfo:'This file contains the lesson, visuals, and player. Open it in a text editor to inspect or change it.',sourceDownload:'Download this HTML',download:'Download skill ZIP ↓',repo:'View source on GitHub ↗',repoUnset:'GitHub link not configured yet.',inspect:'Inspect source',finished:'Complete',illustration:'Scripted illustration · no live AI call'},id:{circle:'Lingkaran: ganti warna',rectangle:'Persegi panjang: ganti warna',shapeHint:'Sorot dengan kursor. Klik atau ketuk untuk mengganti warna.',shapeGroup:'Bentuk interaktif',settings:'Pengaturan pemutaran',captions:'Takarir',chapter:'Bab',chapters:'Daftar bab',play:'▶ Putar',pause:'Ⅱ Jeda',resume:'▶ Lanjutkan',replay:'↻ Putar ulang',prev:'Bab sebelumnya',next:'Bab berikutnya',voice:'Suara',speed:'Kecepatan',start:'▶ Mulai narasi',welcome:'Tekan Putar untuk narasi peramban. Teks tetap tersedia tanpa suara.',ready:'Siap saat Anda siap.',playing:'Memutar',paused:'Dijeda',ended:'Giliran Anda. Buat sesuatu yang layak dijelaskan.',text:'Mode teks · suara bahasa ini belum tersedia.',error:'Mode teks · suara tidak tersedia atau terputus.',voiceReady:'Suara peramban · ketersediaan dan dukungan luring bervariasi.',change:'Perubahan suara / kecepatan mengulang bagian narasi ini.',language:'Ganti ke bahasa Inggris',source:'Kode sumber & unduhan',sourceInfo:'Berkas ini berisi pelajaran, visual, dan pemutar. Buka di editor teks untuk melihat atau mengubahnya.',sourceDownload:'Unduh HTML ini',download:'Unduh ZIP skill ↓',repo:'Lihat kode sumber di GitHub ↗',repoUnset:'Tautan GitHub belum diatur.',inspect:'Lihat kode sumber',finished:'Selesai',illustration:'Ilustrasi terprogram · tanpa panggilan AI langsung'}};
const $=id=>document.getElementById(id),t=key=>UI[state.lang][key],local=x=>x[state.lang];
const synth=window.speechSynthesis;
let last=performance.now();
const state={scene:0,segment:0,lang:'en',rate:1,voiceURI:'',voices:[],playing:false,started:false,ended:false,generation:0,utterance:null,phase:'idle',remaining:0,visualRemaining:0,watchdog:0,speechDone:false,fallback:false,error:false,captions:true,shapeColors:{circle:false,rectangle:false}};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shown=(cue,html)=>`<div class="${state.segment>=cue?(state.playing?'reveal':''):'awaiting'}">${html}</div>`;
function cta(){return `<div class="actions">${LESSON.download?`<a class="button primary" href="${escapeHTML(LESSON.download)}" download>${t('download')}</a>`:''}${/^https:\/\/github\.com\//.test(LESSON.repositoryUrl)?`<a class="button" href="${escapeHTML(LESSON.repositoryUrl)}" target="_blank" rel="noopener">${t('repo')}</a>`:`<span class="small muted">${t('repoUnset')}</span>`}</div>`;}
function visualHTML(s){const l=local(s.labels).map(escapeHTML);switch(s.kind){
case'intro':return `<div class="code-icon">&lt;/&gt;</div><div class="chips">${l.map((v,i)=>`<div class="${state.segment<i+1?'awaiting':state.segment===i+1&&state.playing?'reveal':''}"><span class="chip">${v}</span></div>`).join('')}</div>`;
case'workflow':return `<div class="flow ${state.segment>0?(state.playing?'collapsed animate-collapse':'collapsed'):''}">${l.slice(0,4).map((v,i)=>`<span class="node">${v}</span>${i<3?'<span class="arrow">→</span>':''}`).join('')}</div>${shown(1,`<div class="consolidated">&lt;/&gt; &nbsp;${l[4]}</div>`)}`;
case'motion':return `<svg class="diagram" viewBox="0 0 420 175" role="group" aria-label="${t('shapeGroup')}"><path d="M90 75H330" stroke="#426987" stroke-width="2" stroke-dasharray="5 6"/><circle class="interactive-shape" data-shape="circle" role="button" aria-label="${t('circle')}" aria-pressed="${state.shapeColors.circle}" cx="80" cy="75" r="32" fill="${state.shapeColors.circle?'#5bbfb5':'#193c59'}" stroke="#67e8f9"/><rect class="interactive-shape" data-shape="rectangle" role="button" aria-label="${t('rectangle')}" aria-pressed="${state.shapeColors.rectangle}" x="300" y="43" width="64" height="64" rx="16" fill="${state.shapeColors.rectangle?'#5bbfb5':'#193c59'}" stroke="#67e8f9"/><circle class="moving" cx="115" cy="75" r="8" fill="#67e8f9"/><text x="80" y="145" text-anchor="middle">${l[0]}</text><text x="210" y="25" text-anchor="middle">${l[1]}</text><text x="332" y="145" text-anchor="middle">${l[2]}</text></svg><p class="shape-hint">${t('shapeHint')}</p>${shown(1,`<div class="consolidated">${l[3]}</div>`)}`;
case'edit':return `<div class="small muted">${l[3]}</div><div class="patch"><div class="patch-box">${l[0]}<div class="swatch"></div><code>fill: #fb923c;</code></div>${shown(1,`<div class="patch-box">${l[1]}<div class="swatch after"></div><code>fill: #67e8f9;</code></div>`)}</div><div class="annotation">${l[2]}</div>`;
case'size':return `<div class="stat-grid"><div><div class="stat">${l[0]}</div><div class="small">${l[2]}</div><div class="small muted">Windows Snipping Tool</div></div>${shown(1,`<div class="stat">${l[1]}</div><div class="small">${l[3]}</div>`)}</div><div class="annotation">${escapeHTML(local(s.note))}</div>`;
case'outro':return `<div class="big-mark">&lt;/&gt;</div><div class="eyebrow" style="text-align:center">${l[2]}</div>${cta()}`;
default:return `<svg class="diagram" viewBox="0 0 420 150" role="img" aria-label="${l.join(' → ')}"><path d="M70 60H350" stroke="#67e8f9" stroke-width="2"/>${l.slice(0,3).map((v,i)=>`<circle cx="${70+i*140}" cy="60" r="25" fill="${state.segment>=i?'#23647a':'#20314b'}" stroke="#67e8f9"/><text x="${70+i*140}" y="120" text-anchor="middle">${v}</text>`).join('')}</svg>`;
}}
function renderScene(){const s=LESSON.scenes[state.scene];document.documentElement.lang=state.lang;document.title=`${LESSON.brand} — ${local(s.title)}`;$('brand').textContent=LESSON.brand;$('tagline').textContent=local(LESSON.tagline);$('title').textContent=local(s.title);$('subtitle').textContent=local(s.subtitle);$('eyebrow').textContent=`${t('chapter')} ${String(state.scene+1).padStart(2,'0')} / ${String(LESSON.scenes.length).padStart(2,'0')}`;$('visual').innerHTML=visualHTML(s);$('chapterNav').setAttribute('aria-label',t('chapters'));$('chapterNav').innerHTML=LESSON.scenes.map((s,i)=>`<button aria-label="${t('chapter')} ${i+1}: ${escapeHTML(local(s.title))}" aria-current="${i===state.scene}" class="${i<state.scene?'visited':''}" data-scene="${i}"></button>`).join('');$('caption').textContent=state.started?local(s.segments[state.segment]):'';updateControls();}
function updateControls(){document.body.classList.toggle('playing',state.playing);$('play').textContent=t(state.ended?'replay':state.playing?'pause':state.started?'resume':'play');$('play').setAttribute('aria-label',$('play').textContent);const playParts=$('play').textContent.split(' ');$('play').innerHTML=`<span aria-hidden="true">${playParts.shift()}</span> <span class="play-word">${playParts.join(' ')}</span>`;$('settingsToggle').setAttribute('aria-label',t('settings'));$('settingsToggle').title=t('settings');$('settingsPanel').setAttribute('aria-label',t('settings'));$('prev').textContent='←';$('prev').setAttribute('aria-label',t('prev'));$('next').textContent='→';$('next').setAttribute('aria-label',t('next'));$('prev').disabled=state.scene===0;$('next').disabled=state.scene===LESSON.scenes.length-1;$('page').textContent=`${state.scene+1} / ${LESSON.scenes.length}`;$('language').textContent=state.lang==='en'?'EN / ID':'ID / EN';$('language').setAttribute('aria-label',t('language'));$('voiceTitle').textContent=t('voice');$('speedTitle').textContent=t('speed');$('captions').setAttribute('aria-label',t('captions'));$('captions').title=t('captions');$('captions').setAttribute('aria-pressed',String(state.captions));$('subtitleOverlay').hidden=!state.captions||!state.started||state.ended;$('voice').title=t(state.error?'error':selectedVoice()?'voiceReady':'text');}
function selectedVoice(){return state.voices.find(v=>v.voiceURI===state.voiceURI && v.lang.toLowerCase().startsWith(state.lang))||state.voices.find(v=>v.lang.toLowerCase().startsWith(state.lang));}
function refreshVoices(){state.voices=synth?synth.getVoices():[];const vs=state.voices.filter(v=>v.lang.toLowerCase().startsWith(state.lang));if(!vs.some(v=>v.voiceURI===state.voiceURI))state.voiceURI=vs[0]?.voiceURI||'';$('voice').innerHTML=vs.length?vs.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} (${escapeHTML(v.lang)})</option>`).join(''):`<option value="">${t('text')}</option>`;$('voice').value=state.voiceURI;$('voice').disabled=!vs.length;updateControls();}
// A generation invalidates every callback from a canceled segment, including late onend/onerror.
function cancel(){state.generation++;state.utterance=null;if(synth)synth.cancel();state.phase='idle';state.remaining=0;state.watchdog=0;}
function readingTime(text){return Math.max(2000,text.split(/\s+/).length/2.55*1000/state.rate);}
// Speech-only pronunciation hints; displayed lesson text retains the brand spelling.
function spokenText(text){return text.replace(/\bNovatelle\b/gi,state.lang==='id'?'Novatel':'Nova tell');}
function startSegment(){last=performance.now();cancel();state.phase='segment';state.error=false;state.speechDone=false;state.visualRemaining=650;const text=local(LESSON.scenes[state.scene].segments[state.segment]);state.remaining=readingTime(text);const voice=selectedVoice();state.fallback=!synth||!window.SpeechSynthesisUtterance||!voice;renderScene();if(!state.fallback){const token=state.generation,u=new SpeechSynthesisUtterance(spokenText(text));state.utterance=u;u.lang=state.lang==='id'?'id-ID':'en-US';u.voice=voice;u.rate=state.rate;state.watchdog=Math.max(12000,state.remaining*3);let settled=false;const settle=error=>{if(token!==state.generation||settled)return;settled=true;if(error){state.error=true;state.fallback=true;state.remaining=readingTime(text);updateControls();}else state.speechDone=true;};u.onend=()=>settle(false);u.onerror=()=>settle(true);try{synth.resume();synth.speak(u);}catch{settle(true);}}}
function jump(index){const active=state.playing;cancel();state.scene=index;state.segment=0;state.ended=false;state.playing=active;renderScene();if(active)startSegment();}
// Android speech engines may discard paused speech; restart the unfinished segment on Resume.
function playPause(){last=performance.now();if(state.ended){state.scene=0;state.segment=0;state.ended=false;state.started=true;state.playing=true;startSegment();return;}if(!state.started){state.started=true;state.playing=true;startSegment();return;}if(state.playing){state.playing=false;if(/Android/i.test(navigator.userAgent)){if(state.phase==='segment'&&!state.fallback&&!state.speechDone)cancel();}else if(synth)synth.pause();updateControls();return;}state.playing=true;if(state.phase==='idle')startSegment();else if(synth)synth.resume();updateControls();}
function changeSettings(){if(state.started){const active=state.playing;cancel();state.playing=active;if(active)startSegment();else renderScene();}}
function tick(dt){if(!state.playing)return;if(state.phase==='gap'){state.remaining-=dt;if(state.remaining<=0){if(state.segment+1<LESSON.scenes[state.scene].segments.length){state.segment++;startSegment();}else if(state.scene+1<LESSON.scenes.length){state.scene++;state.segment=0;startSegment();}else{cancel();state.ended=true;state.playing=false;updateControls();}}return;}if(state.phase!=='segment')return;state.visualRemaining-=dt;if(state.fallback){state.remaining-=dt;if(state.remaining<=0)state.speechDone=true;}else if(!state.speechDone){state.watchdog-=dt;if(state.watchdog<=0){state.generation++;if(synth)synth.cancel();state.error=true;state.fallback=true;state.remaining=readingTime(local(LESSON.scenes[state.scene].segments[state.segment]));updateControls();}}if(state.speechDone && state.visualRemaining<=0){state.phase='gap';state.remaining=220;}}
$('play').onclick=playPause;$('prev').onclick=()=>jump(Math.max(0,state.scene-1));$('next').onclick=()=>jump(Math.min(LESSON.scenes.length-1,state.scene+1));$('chapterNav').onclick=e=>{const b=e.target.closest('[data-scene]');if(b)jump(Number(b.dataset.scene));};$('language').onclick=()=>{cancel();state.lang=state.lang==='en'?'id':'en';state.segment=0;state.ended=false;refreshVoices();renderScene();if(state.playing)startSegment();};$('speed').onchange=e=>{state.rate=Number(e.target.value);changeSettings();};$('voice').onchange=e=>{state.voiceURI=e.target.value;changeSettings();};$('captions').onclick=()=>{state.captions=!state.captions;updateControls();};
function toggleShape(shape){const key=shape.dataset.shape;if(!(key in state.shapeColors))return;state.shapeColors[key]=!state.shapeColors[key];shape.setAttribute('aria-pressed',String(state.shapeColors[key]));shape.setAttribute('fill',state.shapeColors[key]?'#5bbfb5':'#193c59');}
$('visual').addEventListener('click',e=>{const shape=e.target.closest('[data-shape]');if(shape)toggleShape(shape);});
const compactSettings=matchMedia('(max-width:1000px)');
function closeSettings(restoreFocus=false){$('settingsToggle').setAttribute('aria-expanded','false');$('settingsPanel').hidden=compactSettings.matches;if(restoreFocus)$('settingsToggle').focus();}
function syncSettings(){const hadFocus=$('settingsPanel').contains(document.activeElement)||document.activeElement===$('captions');if(compactSettings.matches)$('settingsPanel').prepend($('captions'));else $('captionSlot').after($('captions'));$('captionSlot').hidden=compactSettings.matches;$('settingsToggle').hidden=!compactSettings.matches;closeSettings(hadFocus&&compactSettings.matches);}
$('settingsToggle').onclick=()=>{const open=$('settingsToggle').getAttribute('aria-expanded')!=='true';$('settingsToggle').setAttribute('aria-expanded',String(open));$('settingsPanel').hidden=!open;if(open)$('language').focus();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&compactSettings.matches&&$('settingsToggle').getAttribute('aria-expanded')==='true'){e.preventDefault();closeSettings(true);}});
document.addEventListener('pointerdown',e=>{if(!$('settingsPanel').contains(e.target)&&!$('settingsToggle').contains(e.target))closeSettings();});
$('settingsPanel').addEventListener('focusout',e=>{if(e.relatedTarget&&!$('settingsPanel').contains(e.relatedTarget)&&e.relatedTarget!==$('settingsToggle'))closeSettings();});
compactSettings.addEventListener('change',syncSettings);syncSettings();
// Visibility changes never pause playback. Reconcile delayed timer delivery on return.
document.addEventListener('visibilitychange',()=>{pumpClock();});
window.addEventListener('pagehide',()=>{cancel();state.playing=false;});
if(synth)synth.addEventListener('voiceschanged',refreshVoices);
renderScene();refreshVoices();[250,1000,2500].forEach(ms=>setTimeout(refreshVoices,ms));
function pumpClock(){const now=performance.now(),elapsed=now-last;last=now;tick(elapsed);}
setInterval(pumpClock,50);
</script>
